[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-upload"
version = "0.1.0"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  # patchright 与 playwright 必须成对出现、且版本一致：
  #   * patchright —— 四个平台（小红书/视频号/抖音/快手）的发布驱动（15 个文件 import patchright.async_api）；
  #   * playwright —— myUtils/auth.py、myUtils/login.py 的扫码登录 / cookie 校验，以及几个老上传器；
  # patchright 并不依赖 playwright，所以两个都得写。版本不一致的话，两个驱动会各自去找
  # 自己版本的浏览器目录，机器上就得多装一份 chromium（几百 MB，而且很容易只装到一份）。
  # 1.63.0 是本地 .venv 里已验证能跑的那一版，requirements.txt 也与之对齐。
  "patchright==1.63.0",
  "playwright==1.63.0",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
  # at-ai-xhs 改造新增：AI 生成文案需要抽视频首帧/尾帧，这个包自带完整静态 ffmpeg，
  # 免去用户单独安装 ffmpeg / brew 的麻烦
  "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
sau = "sau_cli:main"

[project.optional-dependencies]
web = [
  "Flask[async]==3.1.1",
  "flask-cors==6.0.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["cli_main", "conf", "sau_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "myUtils*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
